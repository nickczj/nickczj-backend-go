# NAS Deployment - copy this file and .env to your NAS
# Image is pulled from GitHub Container Registry
#
# Secrets can be provided via:
# 1. Environment variables (DB_PASSWORD, REDIS_PASSWORD) - simplest
# 2. HashiCorp Vault (set VAULT_ADDR and VAULT_TOKEN) - more secure

services:
  api:
    image: ghcr.io/nickczj/nickczj-backend-go:master
    container_name: nickczj-api
    restart: unless-stopped
    networks:
      - traefik
    environment:
      - APP_ENV=prod
      - TZ=Asia/Singapore
      # Option 1: Direct secrets (simple)
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      # Option 2: Vault (comment out above, uncomment below)
      # - VAULT_ADDR=${VAULT_ADDR}
      # - VAULT_TOKEN=${VAULT_TOKEN}
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nickczj-api.rule=Host(`api.nickczj.com`)"
      - "traefik.http.routers.nickczj-api.entrypoints=websecure"
      - "traefik.http.routers.nickczj-api.tls=true"
      - "traefik.http.routers.nickczj-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.nickczj-api.loadbalancer.server.port=8080"

networks:
  traefik:
    external: true
